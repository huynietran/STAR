# Every push and pull request: compile both sketches for the Uno and run the
# host-side logic tests. A red X means main would not upload. Fix it first.
name: build

on: [push, pull_request]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: |
            - turtle_board
            - reef_station
          libraries: |
            - name: Adafruit SSD1306
            - name: Adafruit GFX Library
            - name: Adafruit BusIO
            - name: DHT sensor library
            - name: Adafruit Unified Sensor
            - name: OneWire
            - name: DallasTemperature
            - name: LiquidCrystal

  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/run.sh
